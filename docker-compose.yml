services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugforge
      POSTGRES_USER: bugforge
      POSTGRES_PASSWORD: bugforge_local_only
    ports:
      - "5432:5432"
    volumes:
      - bugforge-postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugforge -d bugforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugforge-postgres:
